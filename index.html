<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#111713">
    <link rel="icon" href="data:,">
    <title>婚恋资金纠纷材料梳理 · 内部审阅</title>
    <link rel="preload" as="image" type="image/webp"
      href="assets/slides-webp/slide-01.webp"
      media="(min-width: 1101px)" fetchpriority="high">
    <link rel="preload" as="image" type="image/webp"
      href="assets/slides-mobile/slide-01.webp"
      media="(max-width: 1100px)" fetchpriority="high">
    <link rel="stylesheet" href="styles.css?v=5">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">H</span>
          <div class="brand-copy">
            <p class="eyebrow">内部审阅 · 请勿转发</p>
            <h1>婚恋资金纠纷材料梳理</h1>
          </div>
        </div>

        <div class="top-actions">
          <button class="utility-button evidence-quick-button" id="evidenceQuickButton" type="button" aria-label="打开证据材料">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"></path>
            </svg>
            <span class="evidence-quick-label">证据材料</span>
            <b class="evidence-quick-count">04</b>
          </button>
          <button class="utility-button" id="overviewButton" type="button" aria-label="打开页面总览">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            </svg>
            <span>总览</span>
          </button>
          <button class="icon-button" id="fullscreenButton" type="button" aria-label="进入全屏">
            <svg class="icon-expand" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path>
            </svg>
            <svg class="icon-collapse" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" aria-label="页面缩略图">
          <div class="sidebar-scroll">
            <section class="sidebar-section">
              <div class="sidebar-heading">
                <span>页面</span>
                <span>10</span>
              </div>
              <div class="thumbnail-list" id="thumbnailList"></div>
            </section>

            <section class="sidebar-section evidence-navigation">
              <button
                class="evidence-toggle"
                id="evidenceToggle"
                type="button"
                aria-expanded="false"
                aria-controls="evidenceSubmenu"
              >
                <span class="evidence-toggle-icon">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"></path>
                  </svg>
                </span>
                <span class="evidence-toggle-copy">
                  <small>二级菜单</small>
                  <strong>证据材料</strong>
                </span>
                <span class="evidence-toggle-count">04</span>
                <svg class="evidence-chevron" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m8 10 4 4 4-4"></path>
                </svg>
              </button>

              <div class="evidence-submenu" id="evidenceSubmenu" hidden>
                <img
                  class="evidence-side-illustration"
                  src="assets/evidence/evidence-illustration.svg"
                  alt=""
                  width="960"
                  height="360"
                >
                <div id="evidenceSideList"></div>
              </div>
            </section>
          </div>
        </aside>

        <section class="stage-shell" aria-label="演示文稿画面">
          <div class="stage" id="stage">
            <div class="canvas-wrap" id="canvasWrap">
              <div class="slide-loading" id="slideLoading" aria-hidden="true"></div>
              <img
                class="slide-image"
                id="slideImage"
                src="assets/slides-webp/slide-01.webp"
                alt="第 1 页"
                width="1600"
                height="900"
                decoding="async"
                fetchpriority="high"
                draggable="false"
              >
              <div class="slide-error" id="slideError" hidden>
                当前页面无法加载，请确认网页资源文件夹完整。
              </div>
            </div>

            <button class="stage-arrow stage-arrow-prev" id="previousOverlay" type="button" aria-label="上一页">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <button class="stage-arrow stage-arrow-next" id="nextOverlay" type="button" aria-label="下一页">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </button>
          </div>
        </section>
      </main>

      <footer class="controlbar">
        <div class="page-counter" aria-live="polite">
          <span id="currentPage">01</span>
          <span class="counter-divider">/</span>
          <span>10</span>
        </div>

        <div class="control-actions">
          <button class="round-button" id="previousButton" type="button" aria-label="上一页">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <button class="next-button" id="nextButton" type="button">
            <span>下一页</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </div>

        <p class="keyboard-hint">方向键翻页 · F 全屏</p>
      </footer>
    </div>

    <div class="overview" id="overview" hidden>
      <div class="overview-header">
        <div>
          <p class="eyebrow">页面总览</p>
          <h2>选择要查看的页面</h2>
        </div>
        <button class="icon-button overview-close" id="overviewClose" type="button" aria-label="关闭页面总览">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>
      <div class="overview-grid" id="overviewGrid"></div>
    </div>

    <section class="evidence-panel" id="evidencePanel" hidden aria-labelledby="evidencePanelTitle">
      <div class="evidence-panel-inner">
        <header class="evidence-panel-header">
          <div>
            <p class="eyebrow">补充材料 · 二级菜单</p>
            <h2 id="evidencePanelTitle">证据材料</h2>
            <p class="evidence-panel-subtitle">4 份材料，点击任意一项查看大图。</p>
          </div>
          <button class="icon-button" id="evidencePanelClose" type="button" aria-label="关闭证据材料">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </header>

        <div class="evidence-hero">
          <img
            src="assets/evidence/evidence-illustration.svg"
            alt="法院、文件夹和判决文书的插画"
            width="960"
            height="360"
          >
          <div class="evidence-hero-copy">
            <p class="eyebrow">材料归档</p>
            <h3>现场记录与法院判决</h3>
            <p>图片按材料性质分组，保留原始信息，进入大图后可继续切换和缩放。</p>
          </div>
        </div>

        <div class="evidence-grid" id="evidenceGrid"></div>
      </div>
    </section>

    <div
      class="evidence-lightbox"
      id="evidenceLightbox"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="evidenceLightboxTitle"
    >
      <div class="lightbox-toolbar">
        <p class="lightbox-counter" id="evidenceLightboxCounter">01 / 04</p>
        <div class="lightbox-tools">
          <button class="icon-button" id="evidenceZoomButton" type="button" aria-label="切换原始尺寸" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4M8 11h6M11 8v6"></path>
            </svg>
          </button>
          <button class="icon-button" id="evidenceLightboxClose" type="button" aria-label="关闭大图">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </div>
      </div>

      <div class="lightbox-stage" id="lightboxStage">
        <img id="evidenceLargeImage" src="" alt="">
      </div>

      <footer class="lightbox-footer">
        <div class="lightbox-caption">
          <p class="eyebrow" id="evidenceLightboxCategory">现场记录</p>
          <h2 id="evidenceLightboxTitle">对峙现场</h2>
        </div>
        <div class="lightbox-navigation">
          <button class="round-button" id="evidencePreviousButton" type="button" aria-label="上一份材料">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <button class="round-button" id="evidenceNextButton" type="button" aria-label="下一份材料">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <script src="app.js?v=5" defer></script>
  </body>
</html>
