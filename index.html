<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta name="referrer" content="no-referrer">
    <meta name="theme-color" content="#111713">
    <link rel="icon" href="data:,">
    <title>Yellow</title>
    <link rel="preload" as="image" type="image/webp"
      href="assets/slides-webp/slide-01.webp"
      media="(min-width: 1101px)" fetchpriority="high">
    <link rel="preload" as="image" type="image/webp"
      href="assets/slides-mobile/slide-01.webp"
      media="(max-width: 1100px)" fetchpriority="high">
    <link rel="stylesheet" href="styles.css?v=19">
    <link rel="stylesheet" href="mobile-fix.css?v=19">
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">H</span>
          <div class="brand-copy">
            <h1>Yellow</h1>
          </div>
        </div>

        <div class="top-actions">
          <button class="utility-button" id="overviewButton" type="button" aria-label="打开简介">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="3" y="3" width="7" height="7" rx="1"></rect>
              <rect x="14" y="3" width="7" height="7" rx="1"></rect>
              <rect x="3" y="14" width="7" height="7" rx="1"></rect>
              <rect x="14" y="14" width="7" height="7" rx="1"></rect>
            </svg>
            <span>简介</span>
          </button>
          <button class="utility-button" id="contentButton" type="button" aria-label="打开内容">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 7.5A2.5 2.5 0 0 1 5.5 5H10l2 2h6.5A2.5 2.5 0 0 1 21 9.5v7A2.5 2.5 0 0 1 18.5 19h-13A2.5 2.5 0 0 1 3 16.5z"></path>
              <path d="m10 12 5 3-5 3z"></path>
            </svg>
            <span>内容</span>
          </button>
          <button class="icon-button" id="fullscreenButton" type="button" aria-label="进入全屏">
            <svg class="icon-expand" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8 3H3v5M16 3h5v5M8 21H3v-5M16 21h5v-5"></path>
            </svg>
            <svg class="icon-collapse" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M3 8h5V3M21 8h-5V3M3 16h5v5M21 16h-5v5"></path>
            </svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" aria-label="页面缩略图">
          <div class="sidebar-scroll">
            <section class="sidebar-section">
              <div class="sidebar-heading">
                <span>页面</span>
                <span>15</span>
              </div>
              <div class="thumbnail-list" id="thumbnailList"></div>
            </section>
          </div>
        </aside>

        <section class="stage-shell" aria-label="演示文稿画面">
          <div class="stage" id="stage">
            <div class="canvas-wrap" id="canvasWrap">
              <div class="slide-loading" id="slideLoading" aria-hidden="true"></div>
              <img
                class="slide-image"
                id="slideImage"
                src="assets/slides-webp/slide-01.webp"
                alt="第 1 页"
                width="1600"
                height="900"
                decoding="async"
                fetchpriority="high"
                draggable="false"
              >
              <div class="slide-error" id="slideError" hidden>
                当前页面无法加载，请确认网页资源文件夹完整。
              </div>
            </div>

            <button class="stage-arrow stage-arrow-prev" id="previousOverlay" type="button" aria-label="上一页">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m15 18-6-6 6-6"></path>
              </svg>
            </button>
            <button class="stage-arrow stage-arrow-next" id="nextOverlay" type="button" aria-label="下一页">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 18 6-6-6-6"></path>
              </svg>
            </button>
          </div>
        </section>
      </main>

      <footer class="controlbar">
        <div class="page-counter" aria-live="polite">
          <span id="currentPage">01</span>
          <span class="counter-divider">/</span>
          <span>15</span>
        </div>

        <div class="control-actions">
          <button class="round-button" id="previousButton" type="button" aria-label="上一页">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <button class="next-button" id="nextButton" type="button">
            <span>下一页</span>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </div>

        <p class="keyboard-hint">方向键翻页 · F 全屏</p>
      </footer>
    </div>

    <section class="library-page" id="libraryPage" hidden aria-labelledby="libraryPageTitle">
      <div class="library-page-inner">
        <header class="library-page-header">
          <div>
            <p class="eyebrow">Yellow · 全部资料</p>
            <h2 id="libraryPageTitle">简介与内容</h2>
            <p id="libraryPageDescription">15 页材料概览。</p>
          </div>
          <button class="icon-button" id="libraryPageClose" type="button" aria-label="返回演示">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 6 6 18M6 6l12 12"></path>
            </svg>
          </button>
        </header>

        <section class="library-section" id="overviewSection" aria-labelledby="overviewSectionTitle">
          <div class="library-section-heading">
            <div>
              <p class="eyebrow">01 / 简介</p>
              <h3 id="overviewSectionTitle">材料页概览</h3>
            </div>
            <span class="library-section-count">15 页</span>
          </div>
          <div class="overview-grid" id="overviewGrid"></div>
        </section>

        <section class="library-section" id="contentSection" aria-labelledby="contentSectionTitle">
          <div class="library-section-heading">
            <div>
              <p class="eyebrow">02 / 内容</p>
              <h3 id="contentSectionTitle">图片与现场视频</h3>
            </div>
            <span class="library-section-count">13 项</span>
          </div>

          <div class="content-group" id="imagesSection" aria-labelledby="imagesSectionTitle">
            <div class="content-group-heading">
              <h4 id="imagesSectionTitle">图片资料</h4>
              <span>05</span>
            </div>
            <div class="content-grid content-image-grid" id="contentImageGrid"></div>
          </div>

          <div class="content-group" id="videosSection" aria-labelledby="videosSectionTitle">
            <div class="content-group-heading">
              <h4 id="videosSectionTitle">视频资料</h4>
              <span>08</span>
            </div>
            <div class="content-grid content-video-grid" id="contentVideoGrid"></div>
          </div>
        </section>
      </div>
    </section>

    <div
      class="media-viewer"
      id="mediaViewer"
      hidden
      role="dialog"
      aria-modal="true"
      aria-labelledby="mediaViewerTitle"
    >
      <div class="media-viewer-toolbar">
        <p class="media-counter" id="mediaCounter">01 / 05</p>
        <button class="icon-button" id="mediaViewerClose" type="button" aria-label="关闭大图">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 6 6 18M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <div class="media-viewer-stage" id="mediaViewerStage">
        <img id="mediaViewerImage" src="" alt="">
        <div class="media-video-shell" id="mediaVideoShell" hidden>
          <video
            id="mediaViewerVideo"
            controls
            playsinline
            webkit-playsinline
            x5-playsinline
            x5-video-player-type="h5"
            x5-video-player-fullscreen="true"
            preload="metadata"
          ></video>
          <div class="media-loading" id="mediaLoading" hidden data-state="loading">
            <span class="media-spinner" aria-hidden="true"></span>
            <div class="media-loading-copy">
              <span id="mediaLoadingText">正在加载视频</span>
              <div
                class="media-progress"
                id="mediaProgress"
                role="progressbar"
                aria-label="视频缓冲进度"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-valuenow="0"
                hidden
              >
                <span class="media-progress-fill" id="mediaProgressFill"></span>
              </div>
            </div>
          </div>
        </div>
      </div>

      <footer class="media-viewer-footer">
        <div>
          <p class="eyebrow" id="mediaCategory">图片资料</p>
          <h2 id="mediaViewerTitle">图片 01</h2>
        </div>
        <div class="media-navigation">
          <button class="media-quality" id="mediaQualityButton" type="button" hidden>高清</button>
          <a class="media-open-video" id="mediaOpenVideo" href="" target="_blank" rel="noopener noreferrer" hidden>
            打开视频
          </a>
          <button class="round-button" id="mediaPreviousButton" type="button" aria-label="上一个">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m15 18-6-6 6-6"></path>
            </svg>
          </button>
          <button class="round-button" id="mediaNextButton" type="button" aria-label="下一个">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m9 18 6-6-6-6"></path>
            </svg>
          </button>
        </div>
      </footer>
    </div>

    <script src="app.js?v=19" defer></script>
  </body>
</html>
